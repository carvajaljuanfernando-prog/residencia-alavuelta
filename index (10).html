:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de una columna (máx 760px) con barra de pestañas fija abajo en móvil; la pantalla "Hoy" es el punto de entrada para sesiones cortas. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#e9edf3; --fg:#17212b; --muted:#5b6774; --line:#d6dde6;
  --accent:#0b7a72; --accent-soft:#d9efec; --accent-fg:#ffffff;
  --good:#1a7f4b; --good-soft:#dcf3e6; --bad:#b4312b; --bad-soft:#f9dedc; --warn:#a65d07; --warn-soft:#fbe9cf;
  --display:"Bricolage Grotesque","Source Sans 3",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#171f27; --surface2:#1f2a34; --fg:#e8edf2; --muted:#9aa7b4; --line:#2c3843;
  --accent:#3fc1b6; --accent-soft:#143a38; --accent-fg:#06211f;
  --good:#52c98a; --good-soft:#143524; --bad:#ff7b72; --bad-soft:#3e1d1b; --warn:#f0b35a; --warn-soft:#3b2a12; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#171f27; --surface2:#1f2a34; --fg:#e8edf2; --muted:#9aa7b4; --line:#2c3843;
  --accent:#3fc1b6; --accent-soft:#143a38; --accent-fg:#06211f;
  --good:#52c98a; --good-soft:#143524; --bad:#ff7b72; --bad-soft:#3e1d1b; --warn:#f0b35a; --warn-soft:#3b2a12; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 92px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:700}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:18px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .mark{font-family:var(--mono);font-size:.8rem;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.accent{background:var(--accent-soft);border-color:transparent}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.stat .l{font-size:.85rem;color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 14px;transition:transform .08s ease}
button:active{transform:scale(.98)}
button:focus-visible,.opt:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:600}
button.big{padding:16px 18px;font-size:1.05rem;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%}
button.big small{display:block;font-weight:400;font-size:.85rem;opacity:.85}
button.ghost{background:transparent}
button[disabled]{opacity:.5;cursor:not-allowed}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .inner{display:flex;width:100%;max-width:760px}
nav.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:10px 4px;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
nav.tabs button .ic{font-family:var(--mono);font-size:1rem}
nav.tabs button.on{color:var(--accent);font-weight:600;box-shadow:inset 0 3px 0 var(--accent)}
.view{display:flex;flex-direction:column;gap:18px}
/* nivel */
.gauge{display:flex;align-items:center;gap:16px}
.ring{width:92px;height:92px;flex:none}
.bar{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar i.good{background:var(--good)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.arealist{display:flex;flex-direction:column;gap:10px}
.arearow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:.92rem}
.arearow .bar{grid-column:1/-1}
.pill{font-family:var(--mono);font-size:.72rem;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1rem}
.timer.low{color:var(--bad)}
.stem{font-size:1.05rem;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.opt b{font-family:var(--mono);flex:none;width:1.4em;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-left:4px solid var(--accent);padding:10px 14px;background:var(--surface2);border-radius:0 10px 10px 0;display:flex;flex-direction:column;gap:8px}
.fb.ok{border-color:var(--good)} .fb.ko{border-color:var(--bad)}
.fb .t{font-weight:600}
.perla{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.perla .k{font-family:var(--mono);color:var(--accent);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;padding-top:3px;flex:none}
.navq{display:flex;gap:6px;flex-wrap:wrap}
.navq button{width:34px;height:34px;padding:0;font-family:var(--mono);font-size:.8rem}
.navq button.ans{background:var(--accent-soft);border-color:var(--accent)}
.navq button.mark{box-shadow:inset 0 -3px 0 var(--warn)}
.navq button.cur{outline:2px solid var(--fg)}
/* ruta */
details{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details summary{cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;list-style:none;font-weight:600}
details summary::-webkit-details-marker{display:none}
details .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.task{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.task input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.task.done span{color:var(--muted);text-decoration:line-through}
.phase{display:flex;gap:10px;align-items:center}
.phase .n{font-family:var(--mono);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);font-size:.85rem;flex:none}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tablewrap{overflow-x:auto;min-width:0}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
select,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--fg);width:100%}
textarea{font-family:var(--mono);font-size:.78rem;min-height:90px}
.flash{perspective:1000px}
.flashcard{min-height:160px;border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--surface);display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.05rem;cursor:pointer}
.flashcard.back{background:var(--accent-soft)}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:9}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:700px){ body{padding-block:0 20px} nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-right,0px)))} nav.tabs button{flex-direction:row;font-size:.9rem;gap:8px} }
</style>
</head>
<body>



<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark">Ruta MI</span><h1 id="title">Residencia de Medicina Interna</h1></div>
  </header>
  <div id="app" class="view"></div>
</div>

<nav class="tabs"><div class="inner">
  <button data-v="hoy" class="on"><span class="ic">●</span>Hoy</button>
  <button data-v="entrenar"><span class="ic">▶</span>Entrenar</button>
  <button data-v="ruta"><span class="ic">≡</span>Ruta</button>
  <button data-v="progreso"><span class="ic">▲</span>Progreso</button>
  <button data-v="estrategia"><span class="ic">✦</span>Estrategia</button>
</div></nav>

<script src="banco.js"></script>
<script>
(function(){
'use strict';
const B = window.BANCO || [];
const AREAS = [...new Set(B.map(q=>q.area))];
const KEY='rutaMI.v1';
const $=s=>document.querySelector(s);
const app=$('#app');

// ---------- estado persistente ----------
const defaults=()=>({q:{},hist:[],days:[],tasks:{},created:Date.now(),diag:null,name:''});
let S=defaults();
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(defaults(),JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function today(){return new Date().toISOString().slice(0,10);}
function markDay(){const d=today(); if(!S.days.includes(d)){S.days.push(d); save();}}
function streak(){let n=0,d=new Date(); for(;;){const k=d.toISOString().slice(0,10); if(S.days.includes(k)){n++; d.setDate(d.getDate()-1);} else if(n===0 && S.days.includes(prevDay(k))){d.setDate(d.getDate()-1);} else break; if(n>400)break;} return n;}
function prevDay(k){const d=new Date(k); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10);}

// ---------- estadísticas ----------
function qstat(id){return S.q[id]||{n:0,c:0,box:0,due:0,last:0};}
function areaStats(){
  const m={}; AREAS.forEach(a=>m[a]={n:0,c:0,seen:0,total:B.filter(q=>q.area===a).length});
  B.forEach(q=>{const s=qstat(q.id); if(s.n){m[q.area].n+=s.n; m[q.area].c+=s.c; m[q.area].seen++;}});
  return m;
}
function overall(){let n=0,c=0; Object.values(S.q).forEach(s=>{n+=s.n;c+=s.c;}); return {n,c,acc:n?c/n:0};}
function nivel(){
  const o=overall(); const seen=Object.keys(S.q).length/B.length;
  const recent=S.hist.slice(-5); const rec=recent.length?recent.reduce((a,h)=>a+h.score,0)/recent.length:o.acc;
  if(!o.n) return 0;
  return Math.round(100*(0.45*o.acc+0.35*rec+0.20*Math.min(1,seen*1.2)));
}
function dueErrors(){const t=Date.now(); return B.filter(q=>{const s=qstat(q.id); return s.n&&s.box<3&&s.due<=t;});}
function record(q,ok){
  const s=qstat(q.id); s.n++; if(ok)s.c++; s.last=Date.now();
  // Leitner: caja 0 = reciente error (repite en 1 día), 1 = 3 días, 2 = 7 días, 3+ = dominada
  if(ok){s.box=Math.min(4,s.box+1);} else {s.box=0;}
  const gaps=[1,3,7,21,60]; s.due=Date.now()+gaps[s.box]*864e5;
  S.q[q.id]=s;
}
function weakAreas(){const m=areaStats(); return AREAS.map(a=>({a,acc:m[a].n?m[a].c/m[a].n:null,n:m[a].n})).filter(x=>x.acc!==null).sort((x,y)=>x.acc-y.acc);}

// ---------- selección de preguntas ----------
function shuffle(a){a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
function pick(n,opts={}){
  let pool=B.slice();
  if(opts.areas) pool=pool.filter(q=>opts.areas.includes(q.area));
  const m=areaStats(); const t=Date.now();
  const scored=pool.map(q=>{
    const s=qstat(q.id); let w=1;
    if(!s.n) w+=2;                               // no vista
    else{ const acc=m[q.area].n?m[q.area].c/m[q.area].n:0.5; w+= (1-acc)*2; if(s.box<2) w+=1.5; if(s.due<=t && s.box<3) w+=1.5; if(t-s.last<2*864e5) w-=1.2; }
    return {q,w:Math.max(0.1,w)*(0.6+Math.random()*0.8)};
  }).sort((a,b)=>b.w-a.w);
  if(opts.balanced){ // simulacro: reparte por área según peso típico del examen
    const want={"Cardiología":.12,"Neumología":.08,"Nefrología":.08,"Endocrinología":.08,"Infectología":.1,"Gastroenterología":.07,"Hematología":.05,"Reumatología":.04,"Neurología":.06,"Urgencias y toxicología":.05,"Cirugía":.08,"Pediatría":.07,"Ginecoobstetricia":.06,"Salud pública y epidemiología":.06,"Ética y profesionalismo":.02,"Ciencias básicas y farmacología":.05};
    const out=[]; const byArea={}; scored.forEach(x=>{(byArea[x.q.area]=byArea[x.q.area]||[]).push(x.q);});
    AREAS.forEach(a=>{const k=Math.round(n*(want[a]||.05)); out.push(...shuffle(byArea[a]||[]).slice(0,k));});
    const rest=scored.map(x=>x.q).filter(q=>!out.includes(q));
    return shuffle(out.concat(rest.slice(0,Math.max(0,n-out.length))).slice(0,n));
  }
  return shuffle(scored.slice(0,n).map(x=>x.q));
}

// ---------- ruta de estudio ----------
const PLAN=[
 {s:1,f:1,t:"Diagnóstico y método",a:["Cardiología","Neumología"],d:"Presenta el diagnóstico inicial de 30 preguntas sin estudiar antes: la meta es saber de dónde partes, no el puntaje. Aprende el método de lectura de preguntas de la pestaña Estrategia.",x:["Hacer el diagnóstico inicial (30 preguntas, 45 min)","Leer la sección 'Cómo se construye una pregunta' en Estrategia","Lun-Vie: 10 preguntas de Cardiología/Neumología por día y leer TODAS las explicaciones","Sábado: bloque de 20 preguntas por área débil detectada","Anotar en el cuaderno de errores cada pregunta fallada con la perla"]},
 {s:2,f:1,t:"Cardiología de alto rendimiento",a:["Cardiología"],d:"SCA, falla cardíaca (4 pilares), fibrilación auricular (CHA2DS2-VASc), HTA resistente, arritmias, valvulopatías, TEP.",x:["Repasar criterios de IAMCEST vs IAMSEST y manejo antitrombótico","Memorizar los 4 pilares de la FEVI reducida y los perfiles de Stevenson","Lun-Vie: 10 preguntas de Cardiología + repaso de errores pendientes","Sábado: 20 preguntas de Cardiología; revisar las 3 perlas que más se te olvidan","Domingo: 15 min de flashcards de perlas"]},
 {s:3,f:2,t:"Neumología",a:["Neumología","Cardiología"],d:"EPOC (grupos GOLD y eosinófilos), asma en crisis, neumonía (CURB-65), derrame pleural (Light), tuberculosis (esquema y efectos adversos), SDRA, nódulo pulmonar.",x:["Revisar GOLD 2025: grupos A, B y E y cuándo usar corticoide inhalado","Aprender criterios de Light y el pH/glucosa que obligan a drenar","Lun-Vie: 10 preguntas mezclando Neumología y Cardiología","Sábado: bloque de 20 de Neumología","Repaso de errores: dejar la cola en cero"]},
 {s:4,f:2,t:"Nefrología, líquidos y ácido-base",a:["Nefrología","Ciencias básicas y farmacología"],d:"Hiponatremia por volemia, hiperkalemia (calcio → insulina → eliminar), gases (Winter, anión gap), LRA prerrenal vs NTA (FENa), síndrome nefrótico/nefrítico, ERC y nefroprotección.",x:["Practicar 10 gasometrías con la fórmula de Winter y anión gap","Hacer un cuadro: hiponatremia según volemia y su tratamiento","Lun-Vie: 10 preguntas de Nefrología","Sábado: 20 preguntas de Nefrología + Ciencias básicas","Repaso de errores pendientes"]},
 {s:5,f:2,t:"Endocrinología",a:["Endocrinología"],d:"CAD vs EHH (potasio antes de insulina), DM2 y elección de fármaco por comorbilidad, tiroides (Graves, nódulo, hipotiroidismo), suprarrenal (Addison, Cushing, hiperaldosteronismo), osteoporosis, prolactinoma.",x:["Tabla de fármacos para DM2: beneficio cardiovascular, renal y en peso","Algoritmo de nódulo tiroideo (TSH → gammagrafía o ecografía/BACAF)","Lun-Vie: 10 preguntas de Endocrinología","Sábado: 20 de Endocrinología + 10 de repaso de Cardiología","Flashcards: criterios diagnósticos de diabetes y resolución de CAD"]},
 {s:6,f:2,t:"Infectología y Colombia tropical",a:["Infectología"],d:"Sepsis (paquete de 1 h, norepinefrina), VIH (inicio de TAR, criptococo), dengue (signos de alarma), malaria (esquemas por especie), meningitis, leptospira, Chagas, antibióticos y Pseudomonas, C. difficile.",x:["Memorizar signos de alarma de dengue y esquema de malaria por especie","Lista de antibióticos con y sin cobertura antipseudomonas","Lun-Vie: 10 preguntas de Infectología","Sábado: simulacro corto de 30 preguntas mixtas (45 min)","Revisar el simulacro: clasificar cada error como conocimiento, lectura o descuido"]},
 {s:7,f:2,t:"Gastroenterología y hepatología",a:["Gastroenterología"],d:"Hemorragia variceal y no variceal, H. pylori (cuádruple con bismuto), pancreatitis, cirrosis (PBE, encefalopatía), hepatitis B serología, enfermedad inflamatoria intestinal, tamización de cáncer colorrectal.",x:["Serología de hepatitis B: tabla de los 6 escenarios","Diferencias Crohn vs colitis ulcerativa en una tabla","Lun-Vie: 10 preguntas de Gastroenterología","Sábado: 20 de Gastro + 10 de Infectología","Repaso de errores pendientes"]},
 {s:8,f:2,t:"Hematología, reumatología y neurología",a:["Hematología","Reumatología","Neurología"],d:"Anemias (ferropenia, B12), warfarina (INR alto), PTT, transfusión, mieloma; artritis reumatoide, gota, lupus, artritis séptica, arteritis; ACV (ventanas), estado epiléptico, HSA, Guillain-Barré, miastenia.",x:["Ventanas de trombólisis y trombectomía en ACV; manejo de la PA","Secuencia de fármacos en estado epiléptico","Lun-Vie: 10 preguntas alternando las tres áreas","Sábado: 30 preguntas mixtas de Medicina Interna (45 min)","Domingo: flashcards de perlas de las semanas 2 a 8"]},
 {s:9,f:3,t:"Cirugía y urgencias",a:["Cirugía","Urgencias y toxicología"],d:"Abdomen agudo, colangitis (Charcot/Reynolds), hernias, trauma (cuándo laparotomía), obstrucción intestinal, pie diabético, mama, manejo perioperatorio de anticoagulantes; anafilaxia, paro, neumotórax a tensión, intoxicaciones (acetaminofén, organofosforados), Parkland.",x:["Repasar ATLS: evaluación primaria y las 5 causas de choque en trauma","Antídotos: tabla de 10 tóxicos frecuentes","Lun-Vie: 10 preguntas de Cirugía/Urgencias","Sábado: 20 de Cirugía + repaso de errores de Medicina Interna","Flashcards de urgencias"]},

function toast(m){const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function ringSVG(v){const r=38,c=2*Math.PI*r,off=c*(1-v/100);

const RULES=["Lee primero la última línea de la pregunta (lo que realmente preguntan) y luego la viñeta: evitas perderte en datos de relleno.","Cada pregunta fallada vale más que diez acertadas: escribe por qué fallaste (no sabía, leí mal, dudé entre dos) y la perla.","En las explicaciones, lee también por qué las otras tres opciones están mal: ahí viven las próximas preguntas.","Sesión corta diaria > maratón de fin de semana. 10 preguntas con explicación cuestan 12 minutos.","Las palabras 'más probable', 'inicial', 'de elección' y 'siguiente paso' cambian la respuesta correcta. Subráyalas mentalmente.","Si dudas entre dos opciones, elige la más conservadora y segura para el paciente; el examen premia la conducta estándar de guía, no la heroica.","Desconfía de los absolutos ('siempre', 'nunca', 'todos'): suelen ser distractores.","Las preguntas de ciencias básicas aparecen disfrazadas de clínica: pregúntate qué mecanismo explica el hallazgo.","El sábado es para bloques largos y simulacros; entre semana solo mantén el músculo.","En el simulacro, no te quedes más de 90 segundos en una pregunta: márcala y sigue. Las fáciles valen lo mismo que las difíciles.","Revisa el simulacro al día siguiente, no el mismo día: la fatiga esconde los patrones de error.","Dormir 7 horas la noche anterior a un simulacro mejora más el puntaje que 2 horas extra de estudio.","Si una perla se te olvida tres veces, conviértela en una regla con tus propias palabras.","Nunca cambies una respuesta marcada salvo que encuentres un dato objetivo que la contradiga: el primer instinto acierta más.","Entrena el formato de la universidad a la que aplicas: UdeA es velocidad (2 min/pregunta); UNAL es resistencia (150 preguntas).","La semana del examen no se estudia nada nuevo. Se duerme, se repasan perlas y se confía en el trabajo hecho."];

// ---------- sesión de preguntas ----------
function startSession(o){
  const qs=o.qs||pick(o.n,{areas:o.areas,balanced:o.balanced});
  if(!qs.length){toast('No hay preguntas para esa selección');return;}
  session={mode:o.mode,qs,i:0,ans:new Array(qs.length).fill(null),marked:new Set(),label:o.label,diag:!!o.diag,
    end:o.minutes?Date.now()+o.minutes*60000:null,revealed:false,review:false};
  if(session.end){timerId=setInterval(()=>{const t=$('#timer'); if(!t)return; const ms=session.end-Date.now(); if(ms<=0){finishSim();return;} t.textContent=fmt(ms); t.classList.toggle('low',ms<5*60000);},1000);}
  render();
}
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function endSession(){if(timerId){clearInterval(timerId);timerId=null;} session=null; render();}

function renderQuiz(){
  const s=session; const q=s.qs[s.i]; const L='ABCD';
  if(s.review){return renderReview();}
  const practice=s.mode==='practica';
  const answered=s.ans[s.i]!==null;
  const show=practice&&answered;
  app.innerHTML=`
  <section class="card">
    <div class="qhead"><div><p class="eyebrow">${esc(s.label)} · ${esc(q.area)}</p><p class="small muted">Pregunta ${s.i+1} de ${s.qs.length} ${q.dif===3?'· difícil':q.dif===1?'· básica':''}</p></div>
      <div class="row">${s.end?`<span class="timer" id="timer">${fmt(s.end-Date.now())}</span>`:''}<button class="ghost small" id="btn-exit">Salir</button></div></div>
    <p class="stem">${esc(q.q)}</p>
    <div class="opts">${q.o.map((t,k)=>{let cls='opt'; if(show){ if(k===q.a)cls+=' ok'; else if(k===s.ans[s.i])cls+=' ko'; } else if(s.ans[s.i]===k)cls+=' sel'; return `<button class="${cls}" data-k="${k}" ${show?'disabled':''}><b>${L[k]}</b><span>${esc(t)}</span></button>`;}).join('')}</div>
    ${show?`<div class="fb ${s.ans[s.i]===q.a?'ok':'ko'}"><p class="t">${s.ans[s.i]===q.a?'Correcto.':'Incorrecto. La respuesta es '+L[q.a]+'.'}</p><p class="small">${esc(q.e)}</p><div class="perla"><span class="k">Perla</span><span>${esc(q.p)}</span></div></div>`:''}
    <div class="row" style="justify-content:space-between">
      <div class="row">${s.i>0?'<button id="btn-prev">← Anterior</button>':''}${!practice?`<button id="btn-mark" class="${s.marked.has(s.i)?'ghost':''}">${s.marked.has(s.i)?'Quitar marca':'Marcar'}</button>`:''}</div>
      <div class="row">${practice?(show?`<button class="primary" id="btn-next">${s.i<s.qs.length-1?'Siguiente →':'Ver resumen'}</button>`:''):(s.i<s.qs.length-1?`<button class="primary" id="btn-next">Siguiente →</button>`:`<button class="primary" id="btn-finish">Terminar simulacro</button>`)}</div>
    </div>
    ${!practice?`<div class="navq">${s.qs.map((_,k)=>`<button data-go="${k}" class="${s.ans[k]!==null?'ans':''} ${s.marked.has(k)?'mark':''} ${k===s.i?'cur':''}">${k+1}</button>`).join('')}</div>`:''}
  </section>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k; if(practice){ if(s.ans[s.i]!==null)return; s.ans[s.i]=k; record(q,k===q.a); markDay(); save(); } else { s.ans[s.i]=k; } render();});
  const nx=$('#btn-next'); if(nx) nx.onclick=()=>{ if(s.i<s.qs.length-1){s.i++; render(); window.scrollTo({top:0});} else finishPractice(); };
  const pv=$('#btn-prev'); if(pv) pv.onclick=()=>{s.i--; render();};
  const mk=$('#btn-mark'); if(mk) mk.onclick=()=>{s.marked.has(s.i)?s.marked.delete(s.i):s.marked.add(s.i); render();};
  const fn=$('#btn-finish'); if(fn) fn.onclick=()=>{const blank=s.ans.filter(a=>a===null).length; if(blank && !s.confirm){s.confirm=true; fn.textContent='Hay '+blank+' sin responder. ¿Terminar igual?'; return;} finishSim();};
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{s.i=+b.dataset.go; render();});
  $('#btn-exit').onclick=()=>{ if(!s.exitConfirm){s.exitConfirm=true; $('#btn-exit').textContent='¿Salir sin guardar el simulacro?'; if(practice){endSession();} return;} endSession(); };
}
function finishPractice(){const s=session; const c=s.ans.filter((a,k)=>a===s.qs[k].a).length; S.hist.push({d:today(),label:s.label,n:s.qs.length,c,score:c/s.qs.length,mode:'practica'}); save(); s.review=true; s.summaryOnly=true; render();}
function finishSim(){
  const s=session; if(timerId){clearInterval(timerId);timerId=null;}
  s.qs.forEach((q,k)=>{record(q,s.ans[k]===q.a);}); markDay();
  const c=s.ans.filter((a,k)=>a===s.qs[k].a).length;
  const byArea={}; s.qs.forEach((q,k)=>{const b=byArea[q.area]=byArea[q.area]||{n:0,c:0}; b.n++; if(s.ans[k]===q.a)b.c++;});
  S.hist.push({d:today(),label:s.label,n:s.qs.length,c,score:c/s.qs.length,mode:'simulacro',byArea});
  if(s.diag) S.diag={d:today(),score:c/s.qs.length,byArea};
  save(); s.review=true; s.end=null; render(); window.scrollTo({top:0});
}
function renderReview(){
  const s=session; const L='ABCD'; const c=s.ans.filter((a,k)=>a===s.qs[k].a).length; const pct=Math.round(100*c/s.qs.length);
  const byArea={}; s.qs.forEach((q,k)=>{const b=byArea[q.area]=byArea[q.area]||{n:0,c:0}; b.n++; if(s.ans[k]===q.a)b.c++;});
  const verdict=pct>=85?'Puntaje de admisión. Mantén velocidad y revisa los pocos errores.':pct>=70?'Zona de aprobación (la mayoría de universidades exigen ≥50-60 %, pero el cupo se gana por encima del 75-80 %).':pct>=50?'Aprobarías el mínimo, pero no competirías por cupo todavía. Trabaja las áreas rojas.':'Punto de partida. Cada error de abajo es una pregunta ganada para la próxima.';
  app.innerHTML=`
  <section class="card accent"><p class="eyebrow">${esc(s.label)} · resultado</p>
    <div class="row" style="align-items:flex-end;gap:20px"><div class="stat"><span class="v">${pct} %</span><span class="l">${c} de ${s.qs.length} correctas</span></div>${s.marked.size?`<div class="stat"><span class="v">${s.marked.size}</span><span class="l">marcadas</span></div>`:''}</div>
    <p class="small">${verdict}</p>
    <div class="row"><button class="primary" id="btn-done">Volver al inicio</button>${s.mode==='simulacro'&&!s.showAll?'<button id="btn-all">Revisar pregunta por pregunta</button>':''}</div></section>
  <section class="card"><h3>Por área</h3><div class="arealist">${Object.entries(byArea).sort((a,b)=>(a[1].c/a[1].n)-(b[1].c/b[1].n)).map(([a,b])=>{const v=Math.round(100*b.c/b.n); return `<div class="arearow"><span>${esc(a)} <span class="muted small">${b.c}/${b.n}</span></span><span class="pill ${v<60?'bad':v<75?'warn':'good'}">${v} %</span><div class="bar"><i class="${v<60?'bad':v<75?'warn':'good'}" style="width:${v}%"></i></div></div>`;}).join('')}</div></section>
  ${(s.mode==='simulacro'||s.summaryOnly)?`<section class="card"><h3>${s.showAll?'Todas las preguntas':'Preguntas falladas o sin responder'}</h3>
    ${s.qs.map((q,k)=>{const ok=s.ans[k]===q.a; if(!s.showAll&&ok)return ''; return `<div class="fb ${ok?'ok':'ko'}"><p class="small muted">${k+1}. ${esc(q.area)} · ${esc(q.tema)}</p><p class="small"><b>${esc(q.q)}</b></p><p class="small">${ok?'✓ Respondiste bien: ':'Tu respuesta: '+(s.ans[k]===null?'sin responder':L[s.ans[k]]+'. ')+'Correcta: '}${L[q.a]}. ${esc(q.o[q.a])}</p><p class="small">${esc(q.e)}</p><div class="perla"><span class="k">Perla</span><span>${esc(q.p)}</span></div></div>`;}).join('')||'<p class="small muted">Sin errores. Excelente.</p>'}</section>`:''}`;
  $('#btn-done').onclick=()=>{endSession(); go('hoy');};
  const all=$('#btn-all'); if(all) all.onclick=()=>{s.showAll=true; render();};
}

function startFlash(){
  const cards=shuffle(B).slice(0,20); let i=0,back=false;
  const draw=()=>{const q=cards[i]; app.innerHTML=`<section class="card"><div class="qhead"><p class="eyebrow">Perlas · ${i+1} de ${cards.length} · ${esc(q.area)}</p><button class="ghost" id="fx">Salir</button></div>
    <div class="flash"><div class="flashcard ${back?'back':''}" id="fc" tabindex="0" role="button">${back?esc(q.p):'<span><b>'+esc(q.tema)+'</b><br><span class="muted small">Di en voz alta la perla y toca para comprobar</span></span>'}</div></div>
    <div class="row" style="justify-content:space-between"><button id="fprev" ${i===0?'disabled':''}>← Anterior</button><button class="primary" id="fnext">${i<cards.length-1?'Siguiente →':'Terminar'}</button></div></section>`;
    $('#fc').onclick=()=>{back=!back;draw();}; $('#fc').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();back=!back;draw();}};
    $('#fnext').onclick=()=>{if(i<cards.length-1){i++;back=false;draw();}else{markDay();save();toast('20 perlas repasadas');go('hoy');}};
    $('#fprev').onclick=()=>{i--;back=false;draw();}; $('#fx').onclick=()=>go('hoy');};
  session=null; draw();
}

// ---------- ruta ----------
function renderRuta(){
  const wk=currentWeek();
  const done=w=>PLAN[w-1].x.filter((_,k)=>S.tasks[w+'-'+k]).length;
  app.innerHTML=`
  <section class="card"><h2>Ruta de 16 semanas</h2>
    <p class="small">Pensada para una médica que trabaja: <b>30-40 minutos entre semana</b> (10 preguntas con sus explicaciones + repaso de errores) y <b>un bloque de 90 minutos el sábado</b> (bloque por área o simulacro). Domingo: descanso o 15 minutos de perlas.</p>
    <div class="grid2">${[1,2,3,4].map(f=>`<div class="phase"><span class="n">${f}</span><div><p class="small"><b>${esc(FASES[f])}</b></p><p class="small muted">Semanas ${PLAN.filter(p=>p.f===f).map(p=>p.s).join(', ')}</p></div></div>`).join('')}</div>
    <div class="row"><label class="small" for="sel-week">Semana actual</label><select id="sel-week" style="width:auto">${PLAN.map(p=>`<option value="${p.s}" ${p.s===wk?'selected':''}>Semana ${p.s}</option>`).join('')}</select></div>
    <p class="small muted">Si tu examen está a menos de 16 semanas, comprime: una semana de fundamentos por cada 2 del plan y conserva completas las 4 últimas.</p>
  </section>
  ${PLAN.map(p=>`<details ${p.s===wk?'open':''}><summary><span>S${p.s} · ${esc(p.t)}</span><span class="pill ${done(p.s)===p.x.length?'good':done(p.s)?'acc':''}">${done(p.s)}/${p.x.length}</span></summary>
    <div class="body"><p class="eyebrow">Fase ${p.f} · ${esc(FASES[p.f])}</p><p class="small">${esc(p.d)}</p>
    ${p.x.map((t,k)=>`<label class="task ${S.tasks[p.s+'-'+k]?'done':''}"><input type="checkbox" data-t="${p.s}-${k}" ${S.tasks[p.s+'-'+k]?'checked':''}><span>${esc(t)}</span></label>`).join('')}
    <div class="row"><button class="small" data-train="${p.s}">Entrenar las áreas de esta semana</button></div></div></details>`).join('')}`;
  $('#sel-week').onchange=e=>{S.week=+e.target.value; save(); render();};
  app.querySelectorAll('input[data-t]').forEach(c=>c.onchange=()=>{S.tasks[c.dataset.t]=c.checked; save(); c.closest('.task').classList.toggle('done',c.checked); renderRuta();});
  app.querySelectorAll('[data-train]').forEach(b=>b.onclick=()=>{const p=PLAN[+b.dataset.train-1]; startSession({mode:'practica',n:10,areas:p.a.length>8?null:p.a,label:'Semana '+p.s});});
}

// ---------- progreso ----------
function renderProgreso(){
  const m=areaStats(); const o=overall(); const sims=S.hist.filter(h=>h.mode==='simulacro');
  const repeated=B.filter(q=>{const s=qstat(q.id); return s.n>=2&&(s.n-s.c)>=2;});
  app.innerHTML=`
  <section class="card"><h2>Progreso</h2>
    <div class="grid3"><div class="stat"><span class="v">${nivel()}</span><span class="l">nivel (0-100)</span></div><div class="stat"><span class="v">${Math.round(o.acc*100)||0} %</span><span class="l">acierto global</span></div><div class="stat"><span class="v">${Object.keys(S.q).length}/${B.length}</span><span class="l">preguntas vistas</span></div><div class="stat"><span class="v">${streak()}</span><span class="l">días seguidos</span></div><div class="stat"><span class="v">${S.days.length}</span><span class="l">días de estudio</span></div><div class="stat"><span class="v">${sims.length}</span><span class="l">simulacros</span></div></div></section>
  <section class="card"><h3>Precisión por área</h3><div class="arealist">${AREAS.map(a=>{const b=m[a]; const v=b.n?Math.round(100*b.c/b.n):null; return `<div class="arearow"><span>${esc(a)} <span class="muted small">${b.seen}/${b.total} vistas</span></span><span class="pill ${v===null?'':v<60?'bad':v<75?'warn':'good'}">${v===null?'—':v+' %'}</span><div class="bar"><i class="${v<60?'bad':v<75?'warn':'good'}" style="width:${v||0}%"></i></div></div>`;}).join('')}</div></section>
  <section class="card"><h3>Simulacros</h3>${sims.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Prueba</th><th>Puntaje</th></tr></thead><tbody>${sims.slice().reverse().map(h=>`<tr><td>${h.d}</td><td>${esc(h.label)}</td><td style="font-family:var(--mono)">${h.c}/${h.n} · ${Math.round(h.score*100)} %</td></tr>`).join('')}</tbody></table></div>
    ${sims.length>1?`<div class="bar" aria-hidden="true"><i style="width:${Math.round(sims[sims.length-1].score*100)}%"></i></div><p class="small muted">Último: ${Math.round(sims[sims.length-1].score*100)} % · Primero: ${Math.round(sims[0].score*100)} % · Cambio: ${Math.round(100*(sims[sims.length-1].score-sims[0].score))} puntos</p>`:''}`:'<p class="small muted">Aún no has presentado simulacros. El diagnóstico inicial es el primero.</p>'}</section>
  <section class="card"><h3>Errores repetidos</h3><p class="small muted">Preguntas falladas dos o más veces. Conviértelas en reglas con tus palabras.</p>${repeated.length?repeated.map(q=>`<div class="perla"><span class="k">${esc(q.tema)}</span><span>${esc(q.p)}</span></div>`).join(''):'<p class="small muted">Ninguna por ahora.</p>'}</section>
  <section class="card"><h3>Tu progreso en otro dispositivo</h3><p class="small muted">El progreso se guarda en este navegador. Para pasarlo al computador o al celular, copia este código y pégalo allá.</p>
    <div class="row"><button id="btn-exp">Copiar código de progreso</button><button class="ghost" id="btn-reset">Reiniciar todo</button></div>
    <textarea id="imp" placeholder="Pega aquí un código de progreso copiado en otro dispositivo"></textarea><button id="btn-imp">Importar progreso</button>
    <div class="row"><label class="small" for="nm">Tu nombre (opcional)</label><input id="nm" value="${esc(S.name)}" style="font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)"></div></section>`;
  $('#btn-exp').onclick=()=>{const txt=btoa(unescape(encodeURIComponent(JSON.stringify(S)))); navigator.clipboard.writeText(txt).then(()=>toast('Código copiado')).catch(()=>{$('#imp').value=txt; $('#imp').select(); toast('Selecciona y copia el texto');});};
  $('#btn-imp').onclick=()=>{try{const d=JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim())))); if(!d.q)throw 0; S=Object.assign(defaults(),d); save(); toast('Progreso importado'); render();}catch(e){toast('Código no válido');}};
  $('#btn-reset').onclick=()=>{const b=$('#btn-reset'); if(!b.dataset.c){b.dataset.c=1; b.textContent='¿Seguro? Toca otra vez para borrar'; return;} S=defaults(); save(); toast('Progreso reiniciado'); render();};
  $('#nm').onchange=e=>{S.name=e.target.value.trim(); save();};
}

// ---------- estrategia ----------
function renderEstrategia(){
  app.innerHTML=`
  <section class="card"><h2>Estrategia</h2><p class="small">Lo que define pasar o no pasar rara vez es la cantidad de medicina que sabes: es cómo lees la pregunta, cómo administras el tiempo y qué tan entrenado está el formato. Esta guía resume lo que funciona en los exámenes colombianos.</p></section>
  <section class="card"><h3>1. Cómo es el examen en cada universidad</h3><p class="small muted">No existe examen nacional: cada universidad define su prueba. Verifica siempre la convocatoria vigente; estos datos son orientativos y cambian.</p>
  <div class="tablewrap"><table><thead><tr><th>Universidad</th><th>Formato</th><th>Qué pesa</th><th>Claves</th></tr></thead><tbody>
  <tr><td>U. de Antioquia</td><td>70 preguntas de medicina general (≈2.5 h) + inglés 20-30 preguntas el mismo día</td><td>100 % examen; mínimo 50 % y 60 % en inglés; desempata el inglés</td><td>Sin entrevista. La más concurrida (≈12 cupos de MI). Entrena velocidad: 2 min por pregunta.</td></tr>
  <tr><td>U. Nacional</td><td>Prueba de aptitudes (lectura, razonamiento, gráficas) + examen de conocimientos (≈150 preguntas, 3 h); luego pruebas finales: hoja de vida y entrevista</td><td>Examen ≈80 %; entrevista y hoja de vida el resto</td><td>Resistencia: 150 preguntas. Prepara comprensión lectora y razonamiento, no solo medicina. En entrevista preguntan motivación y temas de actualidad en salud.</td></tr>
  <tr><td>Javeriana</td><td>≈100 preguntas con fuerte peso de Medicina Interna (28-33 %) + entrevista presencial con jefes de departamento</td><td>60 % examen + 40 % Saber Pro; luego entrevista</td><td>El Saber Pro ya está hecho: cada punto del examen cuenta doble. Prepara la entrevista con la misma seriedad.</td></tr>
  <tr><td>UIS</td><td>Examen de conocimientos presencial (computador) con puntaje máximo 45 puntos + hoja de vida</td><td>Examen (aprobado por puntaje mínimo) y luego hoja de vida y notas</td><td>Exige certificado de inglés de 4 habilidades al inscribirse; muchas inscripciones se anulan por documentos.</td></tr>
  <tr><td>U. Libre</td><td>Examen escrito de conocimientos generales y específicos + entrevista</td><td>Examen 80 %</td><td>Publica guía oficial del aspirante con ejes temáticos: ciencias básicas, bioestadística, bioética, farmacología, clínicas.</td></tr>
  <tr><td>FUCS</td><td>≈120 preguntas + evaluación de hoja de vida</td><td>Examen + hoja de vida</td><td>Publicaciones, cursos y experiencia clínica suman puntos.</td></tr>
  <tr><td>Rosario, Bosque, Valle, CES, Cauca</td><td>50-160 preguntas; algunas incluyen preguntas de la especialidad y entrevista</td><td>Variable (p. ej., Cauca: examen 75 + hoja de vida 15)</td><td>Bosque y Cauca incluyen preguntas específicas de la especialidad: refuerza Medicina Interna avanzada.</td></tr>
  </tbody></table></div>
  <p class="small"><b>Decisión de diseño:</b> aplica a 3-5 universidades por ciclo. Cada examen es una oportunidad independiente y el entrenamiento es el mismo.</p></section>
  <section class="card"><h3>2. Cómo se construye una pregunta (y cómo leerla)</h3>
  <ul class="small"><li><b>Estructura típica:</b> viñeta clínica (edad, sexo, antecedentes, síntomas, hallazgos, paraclínicos) + pregunta de 'mejor respuesta única' en una de cinco familias: diagnóstico más probable, siguiente paso diagnóstico, tratamiento inicial/de elección, mecanismo, o conducta ante complicación.</li>
  <li><b>Lee la pregunta final primero.</b> Luego la viñeta sabiendo qué buscar. Subraya mentalmente edad, tiempo de evolución y los 2-3 datos 'anormales'.</li>
  <li><b>Predice la respuesta antes de ver las opciones.</b> Si tu predicción está entre ellas, probablemente es la correcta.</li>
  <li><b>Elimina activamente.</b> En una pregunta de 4 opciones casi siempre hay 2 claramente incorrectas; la decisión real es entre dos.</li>
  <li><b>Palabras que cambian la respuesta:</b> 'inicial' (lo primero que se hace, no lo definitivo), 'de elección' (el estándar de guía), 'más probable' (el más frecuente, no el más grave), 'siguiente paso' (una sola acción).</li>
  <li><b>El examen premia la conducta estándar</b> de las guías colombianas e internacionales recientes, no la excepción brillante.</li></ul></section>
  <section class="card"><h3>3. Método de estudio para quien trabaja</h3>
  <ul class="small"><li><b>Preguntas primero, teoría después.</b> Estudiar leyendo capítulos completos tiene bajo rendimiento; resolver preguntas y leer la explicación de las 4 opciones es el método con mejor evidencia (práctica de recuperación).</li>
  <li><b>12 minutos diarios protegidos:</b> 10 preguntas con explicación. Entre semana no se estudia más; se sostiene.</li>
  <li><b>Sábado, bloque de 90 minutos:</b> 20-30 preguntas por área o un simulacro, y revisión.</li>
  <li><b>Cuaderno de errores:</b> cada fallo se anota como regla de una línea. Antes de cada simulacro se relee.</li>
  <li><b>Repetición espaciada:</b> esta plataforma devuelve lo fallado al día siguiente, a los 3, 7 y 21 días. No lo saltes.</li>
  <li><b>Clasifica cada error</b> en conocimiento (no sabía), lectura (leí mal) o decisión (dudé entre dos y elegí mal). En aspirantes con varios intentos el problema suele ser lectura y decisión, no conocimiento.</li>
  <li><b>Fuentes para profundizar:</b> guías de práctica clínica colombianas (Ministerio de Salud / IETS), GOLD, GINA, ESC/AHA, ADA, KDIGO, Harrison (consulta, no lectura lineal), AIEPI y PAI para pediatría, criterios OMS de anticoncepción. Bancos comerciales (ResiLab, Esturesidencia, cursos como Futuros Residentes o AMIR Colombia) sirven como volumen adicional de preguntas cuando este banco se agote.</li></ul></section>
  <section class="card"><h3>4. El día del examen: estrategia de tres pasadas</h3>
  <ul class="small"><li><b>Pasada 1 (60 % del tiempo):</b> responde todo lo que sabes en menos de 90 segundos; marca lo que dudas y sigue. No dejes preguntas en blanco si no hay penalización (lo habitual en Colombia).</li>
  <li><b>Pasada 2 (30 %):</b> vuelve a las marcadas con la cabeza fresca; a menudo otra pregunta del examen te dio la pista.</li>
  <li><b>Pasada 3 (10 %):</b> verifica la hoja de respuestas (fila correcta, nada en blanco). No cambies respuestas sin un dato objetivo nuevo.</li>
  <li>Desayuno con proteína, agua, baño antes de entrar; llega 45 minutos antes con documento original. Sin celular.</li>
  <li>Noche anterior: 7-8 horas de sueño. Un simulacro con privación de sueño rinde 5-10 puntos menos.</li></ul></section>
  <section class="card"><h3>5. Entrevista (Javeriana, UNAL, Rosario y otras)</h3>
  <ul class="small"><li>Prepara respuestas de 60-90 segundos a: por qué Medicina Interna y no otra; por qué esta universidad; qué harías si no pasas; un caso clínico que te marcó; un error clínico y qué aprendiste; cómo manejas el estrés y la privación de sueño; tu red de apoyo; qué le agregarías al programa.</li>
  <li>Varios intentos previos no son debilidad si lo cuentas como persistencia con método: 'identifiqué que mi problema era X, hice Y, y mi puntaje pasó de A a B'.</li>
  <li>Ten una opinión argumentada y respetuosa sobre temas controversiales de salud en Colombia (reforma a la salud, eutanasia, condiciones laborales de los residentes, Ley 1917 de 2018 de residentes).</li>
  <li>Lleva preguntas para los entrevistadores: rotaciones de primer año, investigación, bienestar del residente.</li>
  <li>Ensaya en voz alta con un colega y grábate; la coherencia entre tu hoja de vida y tu relato es lo que más se evalúa.</li></ul></section>
  <section class="card"><h3>6. Lo que suele fallar en quien lleva varios intentos</h3>
  <ul class="small"><li>Estudiar lo que ya domina porque se siente bien, y evitar las áreas que incomodan. La pestaña Progreso te obliga a verlas.</li>
  <li>Estudiar sin cronómetro y luego quedarse sin tiempo en el examen real.</li>
  <li>Repasar teoría en vez de hacer preguntas en los últimos dos meses.</li>
  <li>Descuidar pediatría, ginecoobstetricia, salud pública y ciencias básicas: entre todas pesan 30-40 % del examen y son las de mejor rendimiento por hora de estudio.</li>
  <li>No preparar inglés (UdeA desempata por inglés) ni los documentos (UIS anula inscripciones por certificados inválidos).</li>
  <li>Presentarse a una sola universidad por ciclo.</li></ul></section>
  <p class="small muted">Esta plataforma es material de preparación elaborado con fines educativos; los contenidos clínicos siguen guías vigentes a 2026 pero deben contrastarse con la convocatoria y las fuentes oficiales de cada universidad.</p>`;
}

render();
})();
</script>
